[workspace]
resolver = "2"
members = [
    "crates/amdgpu-dsl",
    "crates/amdgpu-compiler",
    "crates/amdc",
    "crates/amdgpu-safeasm",
    "crates/amdgpu-layout",
    "crates/amdgpu-isa",
    "crates/amdgpu-tile",
    "crates/amdgpu-kernels",
    "crates/amdgpu-sym",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"

[profile.release]
opt-level = 3
debug = false
