[package]
name = "amdgpu-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Backend: lowering, register allocation and gfx950 assembly emission"

[dependencies]
amdgpu-dsl = { path = "../amdgpu-dsl" }
amdgpu-tile = { path = "../amdgpu-tile" }
amdgpu-kernels = { path = "../amdgpu-kernels" }
amdgpu-safeasm = { path = "../amdgpu-safeasm" }

[dev-dependencies]
amdgpu-dsl = { path = "../amdgpu-dsl" }
amdgpu-safeasm = { path = "../amdgpu-safeasm", features = ["test-support"] }
