[package]
name = "amdgpu-safeasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Safe-Rust authoring of gfx950 instruction sequences: the type system enforces the ISA rules (operand legality, hazards). No dependencies: sequences are exported as plain-data AsmBlocks that the compiler lowers to MIR."
